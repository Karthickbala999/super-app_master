name: Deploy SuperAppMaster Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./superappmaster
        run: npm install

      - name: Build frontend
        working-directory: ./superappmaster
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/superappmaster/*
            sudo cp -r /home/ec2-user/superappmaster/dist/* /var/www/superappmaster/ || exit 1
            sudo chown -R nginx:nginx /var/www/superappmaster
            sudo chmod -R 755 /var/www/superappmaster
            sudo systemctl reload nginx
