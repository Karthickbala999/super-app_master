name: Deploy SuperApp Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Debug repo structure (optional, for troubleshooting)
      - name: List repo files
        run: ls -R

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4. Install dependencies
      - name: Install dependencies
        working-directory: superapp-master
        run: npm install

      # 5. Build frontend
      - name: Build frontend
        working-directory: superapp-master
        run: npm run build

      # 6. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clean old build
            sudo rm -rf /var/www/superapp-master/*
            # Copy new build
            sudo cp -r /home/ec2-user/super-app_master/superapp-master/build/* /var/www/superapp-master/
            # Set permissions
            sudo chown -R nginx:nginx /var/www/superapp-master
            sudo chmod -R 755 /var/www/superapp-master
            # Reload nginx
            sudo systemctl reload nginx
