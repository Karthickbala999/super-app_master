name: Deploy Superapp Backend

on:
  push:
    branches:
      - main   # deploy only on main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Install Node (for npm)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # match your server Node.js version

      # 3️⃣ Deploy to EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}        # EC2 public IP
          username: ec2-user                     # default for Amazon Linux
          key: ${{ secrets.EC2_SSH_KEY }}       # GitHub Secret containing PEM
          port: 22
          script: |
            echo "✅ Connected to EC2"
            cd /home/ec2-user/superapp_backend   # path on your EC2
            git reset --hard
            git pull origin main
            npm install
            pm2 restart superapp-backend --update-env
            pm2 status
