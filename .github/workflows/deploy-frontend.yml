name: Deploy SuperApp to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SUPERAPP_MASTER_PEM }}
          port: 22
          script: |
            # Navigate to backend
            cd /home/ec2-user/superapp-backend

            # Ensure git repo is correct
            git reset --hard
            git pull origin main

            # Install dependencies
            npm install

            # Restart backend with PM2
            pm2 restart superapp-backend --update-env || pm2 start server.js --name superapp-backend --update-env

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SUPERAPP_MASTER_PEM }}
          port: 22
          script: |
            # Navigate to frontend
            cd /home/ec2-user/super-app_master/superapp-master

            # Ensure git repo is correct
            git reset --hard
            git pull origin main

            # Install dependencies and build
            npm install
            npm run build

            # Copy build to web root
            sudo rm -rf /var/www/html/*
            sudo cp -r build/* /var/www/html/
